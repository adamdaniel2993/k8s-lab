
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkstore
  namespace: linkstore
  labels:
    app: linkstore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkstore
  template:
    metadata:
      labels:
        app: linkstore
    spec:
      tolerations:
        - key: "podtype"
          operator: "Equal"
          value: "workload"
      serviceAccountName: linkstore-sa
      containers:
        - name: linkstore
          image: 674288684391.dkr.ecr.us-east-1.amazonaws.com/link-store:latest
          ports:
          - containerPort: 8080

          envFrom:
            - secretRef:
                name: linkstore-db-secret

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20

          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10