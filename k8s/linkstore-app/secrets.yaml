apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: linkstore-db-credentials
  namespace: linkstore
spec:
  provider: aws
  parameters:
    # Tells the AWS provider to fetch credentials via EKS Pod Identity instead of IRSA.
    # Without this it looks for the eks.amazonaws.com/role-arn annotation on the SA and fails.
    usePodIdentity: "true"
    region: us-east-1
    objects: |
      - objectName: "arn:aws:secretsmanager:us-east-1:674288684391:secret:/linkstore/test/rds/postgres/master-3Xm9jr"
        objectType: "secretsmanager"
        jmesPath:
          - path: "username"
            objectAlias: "db-user"
          - path: "password"
            objectAlias: "db-password"
          - path: "host"
            objectAlias: "db-host"
          - path: "dbname"
            objectAlias: "db-name"
          # port is a JSON number in the secret; ASCP only accepts string jmesPath results
          - path: "to_string(port)"
            objectAlias: "db-port"

  # CRITICAL: This block creates the native K8s Secret object
  secretObjects:
  - secretName: linkstore-db-secret
    type: Opaque
    data:
    - objectName: "db-user"
      key: DB_USER
    - objectName: "db-password"
      key: DB_PASSWORD
    - objectName: "db-host"
      key: DB_HOST
    - objectName: "db-name"
      key: DB_NAME
    - objectName: "db-port"
      key: DB_PORT
